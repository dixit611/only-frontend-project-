<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Document Editor</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">



  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">



  <style>

    body {

      font-family: Inter, sans-serif;

      background-color: #f1f3f4;

    }



    .app {

      display: flex;

      height: 100vh;

    }



    /* Sidebar */

    .sidebar {

      width: 240px;

      background: #ffffff;

      border-right: 1px solid #ddd;

      padding: 16px;

    }



    .sidebar h5 {

      font-weight: 600;

      margin-bottom: 16px;

    }



    .doc-item {

      padding: 10px;

      border-radius: 6px;

      cursor: pointer;

    }



    .doc-item.active,

    .doc-item:hover {

      background-color: #e8f0fe;

    }



    /* Editor Area */

    .editor-area {

      flex: 1;

      display: flex;

      flex-direction: column;

    }



    .topbar {

      background: #ffffff;

      padding: 12px 20px;

      border-bottom: 1px solid #ddd;

      display: flex;

      justify-content: space-between;

      align-items: center;

    }



    .editor-wrapper {

      padding: 30px;

      overflow-y: auto;

      flex: 1;

    }



    .editor {

      max-width: 800px;

      margin: auto;

      background: #ffffff;

      min-height: 600px;

      padding: 30px;

      border-radius: 8px;

      box-shadow: 0 1px 6px rgba(0,0,0,0.1);

      outline: none;

    }



    .status {

      font-size: 0.85rem;

      color: #666;

    }

  </style>

</head>

<body>



<div class="app">



  <!-- Sidebar -->

  <div class="sidebar">

    <h5>My Documents</h5>

    <div id="docList"></div>

    <button class="btn btn-primary w-100 mt-3" onclick="createDoc()">+ New Document</button>

  </div>



  <!-- Editor -->

  <div class="editor-area">

    <div class="topbar">

      <input id="docTitle" class="form-control w-50" placeholder="Untitled document" />

      <span id="status" class="status">Saved</span>

    </div>



    <div class="editor-wrapper">

      <div id="editor" class="editor" contenteditable="true"></div>

    </div>

  </div>



</div>



<script>

  const editor = document.getElementById('editor');

  const titleInput = document.getElementById('docTitle');

  const docList = document.getElementById('docList');

  const statusText = document.getElementById('status');



  let documents = JSON.parse(localStorage.getItem('documents')) || [];

  let activeDocId = null;

  let saveTimer;



  function saveToStorage() {

    localStorage.setItem('documents', JSON.stringify(documents));

  }



  function renderDocList() {

    docList.innerHTML = '';

    documents.forEach(doc => {

      const div = document.createElement('div');

      div.className = 'doc-item' + (doc.id === activeDocId ? ' active' : '');

      div.textContent = doc.title || 'Untitled';

      div.onclick = () => loadDoc(doc.id);

      docList.appendChild(div);

    });

  }



  function createDoc() {

    const doc = {

      id: Date.now(),

      title: 'Untitled document',

      content: ''

    };

    documents.unshift(doc);

    saveToStorage();

    loadDoc(doc.id);

  }



  function loadDoc(id) {

    const doc = documents.find(d => d.id === id);

    if (!doc) return;



    activeDocId = id;

    titleInput.value = doc.title;

    editor.innerHTML = doc.content;

    renderDocList();

  }



  function autoSave() {

    clearTimeout(saveTimer);

    statusText.textContent = 'Saving...';



    saveTimer = setTimeout(() => {

      const doc = documents.find(d => d.id === activeDocId);

      if (!doc) return;



      doc.title = titleInput.value;

      doc.content = editor.innerHTML;

      saveToStorage();

      statusText.textContent = 'Saved';

      renderDocList();

    }, 500);

  }



  editor.addEventListener('input', autoSave);

  titleInput.addEventListener('input', autoSave);



  if (documents.length) {

    loadDoc(documents[0].id);

  } else {

    createDoc();

  }

</script>



</body>

</html>
